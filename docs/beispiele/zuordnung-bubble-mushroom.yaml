  bubble-backdrop-background-color: "var(--ha-dialog-scrim-color)"
  bubble-backdrop-filter: "var(--ha-card-backdrop-filter)"
  bubble-border-radius: "var(--ha-border-radius-xl)"
  bubble-button-accent-color: "var(--ha-color-fill-primary-normal-resting)"
  bubble-button-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-button-border-radius: "var(--ha-border-radius-lg)"
  bubble-button-icon-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-button-icon-border-radius: "var(--ha-border-radius-pill)"
  bubble-button-main-background-color: "var(--ha-card-background)"
  bubble-calendar-border-radius: "var(--ha-border-radius-xl)"
  bubble-card-type-border: "var(--ha-border-width-sm) solid var(--ha-color-border-neutral-quiet)"
  bubble-card-type-border-radius: "var(--ha-border-radius-xl)"
  bubble-card-type-box-shadow: "var(--ha-box-shadow-m)"
  bubble-card-type-icon-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-card-type-icon-border-radius: "var(--ha-border-radius-pill)"
  bubble-card-type-main-background-color: "var(--ha-card-background)"
  bubble-climate-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-climate-button-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-color-cursor-indicator-color: "var(--ha-color-on-surface-default)"
  bubble-cover-button-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-cover-buttons-border-radius: "var(--ha-border-radius-lg)"
  bubble-event-accent-color: "var(--ha-color-fill-primary-normal-resting)"
  bubble-event-background-color: "var(--ha-color-surface-low)"
  bubble-footer-box-shadow: "var(--ha-box-shadow-l)"
  bubble-horizontal-buttons-stack-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-horizontal-buttons-stack-border-radius: "var(--ha-border-radius-xl)"
  bubble-icon-color: "var(--ha-color-on-surface-default)"
  bubble-light-color: "var(--ha-color-orange-60)"
  bubble-line-background-color: "var(--ha-color-border-neutral-quiet)"
  bubble-main-background-color: "var(--ha-card-background)"
  bubble-main-buttons-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-media-player-border-radius: "var(--ha-border-radius-xl)"
  bubble-media-player-button-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-media-player-buttons-border-radius: "var(--ha-border-radius-lg)"
  bubble-media-player-play-pause-icon-color: "var(--ha-color-on-primary-normal)"
  bubble-media-player-slider-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-pop-up-border: "var(--ha-border-width-sm) solid var(--ha-color-border-neutral-quiet)"
