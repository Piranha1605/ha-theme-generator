  mush-control-spacing: "var(--ha-space-3)"
  mush-chip-padding: "var(--ha-space-2)"
  mush-title-padding: "var(--ha-space-2)"
  mush-title-spacing: "var(--ha-space-2)"
  mush-chip-avatar-padding: "var(--ha-space-1)"
