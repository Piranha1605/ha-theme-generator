# Bubble Card und Mushroom auf HAs neue Farbebene
#
# Eigenstaendige Theme zum Ausprobieren der Zuordnung aus
# docs/zuordnung-neue-ebene.md. Am 12.10.2026 gegen HA 2026.10.1,
# Bubble Card 3.2.0 und Mushroom an einer laufenden Instanz gemessen.
#
# Zugewiesen sind 68 von 100 Bubble- und 72 von 109 Mushroom-Variablen. Nicht
# zugewiesen bleiben absichtlich: Geometrie einzelner Bauteile (Kalenderhoehe,
# Pop-up-Masken, Ausrichtung), Verhalten (slider-threshold, input-number-debounce)
# und die 29 Zustandstripel von Mushroom - die verkettet Mushroom selbst auf
# seine Palette, mit der Palette sind sie miterledigt.
#
# Kein UIX notwendig. CSS-Variablen erben durch jede Shadow-Grenze; am
# 12.10.2026 nachgemessen, dass ein Wert von html zwoelf Ebenen tief ankommt
# und rgb(var(--mush-rgb-red)) zu rgb(243, 103, 108) aufloest.
#
# Die Toene am Anfang sind nicht Zierde, sondern Voraussetzung: Mushroom baut
# seine Farben aus RGB-Tripeln, und Home Assistant leitet --rgb-<name> nur aus
# Theme-Feldern ab, deren Wert mit # beginnt. Ohne diesen Block sind
# --rgb-cyan-color und Geschwister leer, und die Haelfte der Mushroom-Toene
# faellt aus - ohne Fehlermeldung.

zuordnung_probe:
  # --- Voraussetzung: die klassischen Toene als Hex, damit HA Tripel ableitet ---
  # HA fuehrt alle 19 weiter (am 12.10.2026 im inline-Stylesheet auf html
  # gemessen). Sie sind die einzige Quelle fuer Farbvielfalt: die neue Ebene hat
  # nur fuenf Toene (primary, neutral, red, green, orange).
  red-color: "#f44336"
  pink-color: "#e91e63"
  purple-color: "#926bc7"
  deep-purple-color: "#6e41ab"
  indigo-color: "#3f51b5"
  blue-color: "#2196f3"
  light-blue-color: "#03a9f4"
  cyan-color: "#00bcd4"
  teal-color: "#009688"
  green-color: "#4caf50"
  light-green-color: "#8bc34a"
  lime-color: "#cddc39"
  yellow-color: "#ffeb3b"
  amber-color: "#ffc107"
  orange-color: "#ff9800"
  deep-orange-color: "#ff6f22"
  brown-color: "#795548"
  grey-color: "#9e9e9e"
  blue-grey-color: "#607d8b"

