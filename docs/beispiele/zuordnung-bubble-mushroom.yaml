  mush-card-secondary-line-height: "var(--ha-line-height-normal)"
  mush-chip-font-size: "var(--ha-font-size-s)"
  mush-chip-font-weight: "var(--ha-font-weight-action)"
  mush-title-font-size: "var(--ha-font-size-xl)"
