  bubble-pop-up-main-background-color: "var(--ha-dialog-surface-background)"
  bubble-secondary-background-color: "var(--ha-color-surface-low)"
  bubble-select-arrow-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-select-border: "var(--ha-border-width-sm) solid var(--ha-color-border-neutral-quiet)"
  bubble-select-button-border-radius: "var(--ha-border-radius-lg)"
  bubble-select-list-background-color: "var(--ha-color-surface-low)"
  bubble-select-list-border-radius: "var(--ha-border-radius-lg)"
  bubble-select-list-item-accent-color: "var(--ha-color-fill-primary-normal-resting)"
  bubble-slider-fill-color: "var(--ha-color-fill-primary-loud-resting)"
  bubble-state-climate-auto-color: "var(--ha-color-fill-primary-normal-resting)"
  bubble-state-climate-cool-color: "var(--light-blue-color)"
  bubble-state-climate-dry-color: "var(--amber-color)"
  bubble-state-climate-fan-only-color: "var(--ha-color-fill-neutral-normal-resting)"
  bubble-state-climate-heat-color: "var(--ha-color-orange-60)"
  bubble-state-climate-heat-cool-color: "var(--ha-color-fill-primary-normal-resting)"
  bubble-sub-button-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-sub-button-border-radius: "var(--ha-border-radius-lg)"
  bubble-sub-button-dark-text-color: "var(--ha-color-text-primary-inverted)"
  bubble-sub-button-height: "var(--ha-space-8)"
  bubble-sub-button-highlight-font-size: "var(--ha-font-size-s)"
  bubble-sub-button-light-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-sub-slider-background-color: "var(--ha-color-fill-neutral-quiet-resting)"
  bubble-sub-slider-border-radius: "var(--ha-border-radius-lg)"
  bubble-sub-slider-height: "var(--ha-space-10)"

  # --- Mushroom (72 von 109) ---
  # Die 30 Palettentripel. Die 29 Zustandstripel fehlen absichtlich: Mushroom
  # verkettet sie selbst hierauf (state-light -> rgb-orange, person-home ->
  # rgb-success). Nur wo ein Zustand bewusst abweichen soll, kommt er dazu.
  mush-rgb-red: "var(--rgb-ha-color-red-60)"
  mush-rgb-green: "var(--rgb-ha-color-green-60)"
  mush-rgb-orange: "var(--rgb-ha-color-orange-60)"
  mush-rgb-blue: "var(--rgb-ha-color-primary-60)"
  mush-rgb-grey: "var(--rgb-ha-color-neutral-60)"
  mush-rgb-light-grey: "var(--rgb-ha-color-neutral-80)"
  mush-rgb-dark-grey: "var(--rgb-ha-color-neutral-40)"
  mush-rgb-black: "var(--rgb-ha-color-black)"
  mush-rgb-white: "var(--rgb-ha-color-white)"
  mush-rgb-disabled: "var(--rgb-ha-color-neutral-70)"
  mush-rgb-info: "var(--rgb-ha-color-primary-60)"
  mush-rgb-success: "var(--rgb-ha-color-green-60)"
  mush-rgb-warning: "var(--rgb-ha-color-orange-60)"
  mush-rgb-danger: "var(--rgb-ha-color-red-60)"
  mush-rgb-update-installing: "var(--rgb-ha-color-primary-60)"
  mush-rgb-update-off: "var(--rgb-ha-color-primary-60)"
  # Diese 14 haben auf der neuen Ebene kein Gegenstueck und kommen aus dem
  # klassischen Tonblock oben.
  mush-rgb-pink: "var(--rgb-pink-color)"
  mush-rgb-purple: "var(--rgb-purple-color)"
  mush-rgb-deep-purple: "var(--rgb-deep-purple-color)"
  mush-rgb-indigo: "var(--rgb-indigo-color)"
  mush-rgb-light-blue: "var(--rgb-light-blue-color)"
  mush-rgb-cyan: "var(--rgb-cyan-color)"
  mush-rgb-teal: "var(--rgb-teal-color)"
  mush-rgb-light-green: "var(--rgb-light-green-color)"
  mush-rgb-lime: "var(--rgb-lime-color)"
  mush-rgb-yellow: "var(--rgb-yellow-color)"
  mush-rgb-amber: "var(--rgb-amber-color)"
  mush-rgb-deep-orange: "var(--rgb-deep-orange-color)"
  mush-rgb-brown: "var(--rgb-brown-color)"
  mush-rgb-blue-grey: "var(--rgb-blue-grey-color)"
  # Farben, Masse, Rundungen, Schrift
  mush-title-color: "var(--ha-color-text-primary)"
  mush-card-primary-color: "var(--ha-color-text-primary)"
  mush-subtitle-color: "var(--ha-color-text-secondary)"
  mush-card-secondary-color: "var(--ha-color-text-secondary)"
  mush-chip-border-color: "var(--ha-color-border-neutral-quiet)"
  mush-chip-background: "var(--ha-color-fill-neutral-quiet-resting)"
  mush-chip-box-shadow: "var(--ha-box-shadow-s)"
  # Achtung: mush-icon-border-radius, nicht icon-border-radius. Mushroom leitet
  # letzteres selbst weiter unten im Baum ab; ein Wert von aussen traegt dort
  # nur mit !important.
  mush-icon-border-radius: "var(--ha-border-radius-circle)"
  mush-badge-border-radius: "var(--ha-border-radius-circle)"
  mush-chip-avatar-border-radius: "var(--ha-border-radius-circle)"
  mush-chip-border-radius: "var(--ha-border-radius-pill)"
  mush-control-border-radius: "var(--ha-border-radius-pill)"
  mush-icon-size: "var(--ha-space-6)"
  mush-control-icon-size: "var(--ha-space-6)"
  mush-icon-symbol-size: "var(--ha-space-5)"
  mush-badge-size: "var(--ha-space-4)"
  mush-badge-icon-size: "var(--ha-space-3)"
  mush-chip-icon-size: "var(--ha-space-4)"
  mush-chip-height: "var(--ha-space-10)"
  mush-control-height: "var(--ha-space-10)"
